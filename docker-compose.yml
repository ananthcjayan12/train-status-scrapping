version: '3'

services:
  web:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  worker:
    build: .
    command: python -m celery -A celery_config worker --loglevel=info --concurrency=3
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - C_FORCE_ROOT=true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    restart: unless-stopped

  flower:
    build: .
    command: python -m celery -A celery_config flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --replica-read-only no
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
    restart: unless-stopped 